# Release and publish a version when its tag v<version> is pushed. The build
# job checks that the tag names the version of the manifest and that
# CHANGELOG.md has a section for it, waits for the CI run of the tagged commit
# and takes the VSIX that this run tested and built, so the release neither
# repeats the tests nor builds the package again. The GitHub release job
# creates the release of the tag with the GitHub CLI, with that section as its
# notes and the VSIX as its file. A release that exists keeps its notes and
# receives only a missing VSIX. The publish job downloads the VSIX of the
# GitHub release, signs in to Microsoft Entra ID with the official azure/login
# action and publishes the VSIX with vsce, the official Marketplace tool. The
# sign-in exchanges the OpenID Connect token of the job through the federated
# credential of the publishing app registration, so no long-lived credential
# is stored. The publish job fails until the one-time setup of CONTRIBUTING.md
# is complete. A re-run then publishes the version. A re-run keeps the VSIX
# that the release already holds, and the Marketplace skips a version that it
# already holds, so no version is published twice.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  # Every job reads the repository; the jobs below add their own scopes.
  contents: read

concurrency:
  # One run per tag, and a running release is never cancelled.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release build
    runs-on: ubuntu-latest
    # Waits for the CI run of the tagged commit, which runs the Docker tests of an extension too.
    timeout-minutes: 60
    permissions:
      contents: read
      # Reads the CI runs of the commit and downloads the VSIX of one of them.
      actions: read
    outputs:
      # The file name of the VSIX, <name>-<version>.vsix from the manifest, for the later jobs.
      vsix: ${{ steps.check.outputs.vsix }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag and take the notes of the version
        id: check
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not name the manifest version $version."
            exit 1
          fi
          awk -v heading="## $version" \
            '$0 == heading { found = 1; next } found && (/^## / || /^---$/) { exit } found { print }' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for version $version."
            exit 1
          fi
          echo "vsix=$(node -p 'const {name, version} = require("./package.json"); `${name}-${version}.vsix`')" >> "$GITHUB_OUTPUT"

      # The push of the commit to main starts the CI run; a tag pushed right after it may arrive first, so the step
      # looks for the run for up to 5 minutes and then waits until it ends. Only a passed run gives the VSIX.
      - name: Wait for the CI run of the tagged commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in $(seq 30); do
            run=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::No CI run for $GITHUB_SHA: push the commit to main before its tag."
            exit 1
          fi
          if ! gh run watch "$run" --exit-status --interval 30 > /dev/null; then
            echo "::error::The CI run $run of $GITHUB_SHA did not pass."
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Download the VSIX of the CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          run-id: ${{ steps.ci.outputs.run }}
          github-token: ${{ github.token }}

      - name: Check the VSIX
        env:
          VSIX: ${{ steps.check.outputs.vsix }}
        run: |
          if [ ! -f "$VSIX" ]; then
            echo "::error::The CI run holds no $VSIX."
            exit 1
          fi

      - name: Keep the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ${{ steps.check.outputs.vsix }}
            notes.md
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading its file needs write access.
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      # The GitHub CLI of the runner creates the release as a draft, uploads
      # the VSIX and publishes the release after the upload. A release that
      # exists keeps its notes, and a VSIX that it holds stays unchanged.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          vsix="$VSIX"
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > assets.txt; then
            if grep -Fqx "$vsix" assets.txt; then
              echo "The release $GITHUB_REF_NAME keeps its file $vsix."
            else
              gh release upload "$GITHUB_REF_NAME" "$vsix"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$vsix" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi

  publish:
    name: Publish to the Visual Studio Marketplace
    needs: [build, github-release]
    runs-on: ubuntu-latest
    # The rules of the environment decide which runs may publish, and its name
    # is part of the subject of the federated credential.
    environment: marketplace
    permissions:
      contents: read
      # azure/login exchanges the OpenID Connect token of this job.
      id-token: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install the locked development tools without install scripts
        run: npm ci --ignore-scripts

      - name: Download the VSIX of the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: gh release download "$GITHUB_REF_NAME" --pattern "$VSIX"

      - name: Sign in to Microsoft Entra ID
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # An app registration publishes without an Azure subscription.
          allow-no-subscriptions: true

      - name: Publish the VSIX package
        env:
          # vsce requests the token of the signed-in Azure CLI for this tenant.
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: npx vsce publish --azure-credential --packagePath "$VSIX" --skip-duplicate
